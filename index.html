<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shizuku Pomodoro</title>
<link rel="stylesheet" href="style.css">
<!-- Supabase ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Chart.js（グラフ描画ライブラリ） -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<main class="app">
  <div class="sparkle">✦</div>
  <p class="eyebrow">SHIZUKU'S FOCUS ROOM</p>
  <h1>Pomodoro</h1>
  <section class="timer-card">
    <div id="phase" class="phase">作業</div>
    <div id="timer" class="timer">25:00</div>
    <div id="overtime" class="overtime">25分を超えても、そのまま続けられます</div>
    <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
    <div class="buttons">
      <button id="startBtn" class="primary">▶ スタート</button>
      <button id="stopBtn" class="secondary" disabled>■ 終了</button>
    </div>
    <button id="breakBtn" class="text-button">5分休憩を始める</button>
  </section>
  <section class="stats">
    <div class="stat"><span>今日の作業時間</span><strong id="todayTime">0分</strong></div>
    <div class="stat"><span>セッション</span><strong id="sessions">0回</strong></div>
    <div class="stat"><span>最長セッション</span><strong id="longest">0分</strong></div>
  </section>

  <!-- ★ 追加：Supabaseのデータを可視化するグラフエリア -->
  <section class="history-card">
    <div class="history-head">
      <h2>作業ログ（グラフ）</h2>
    </div>
    <div style="position: relative; width: 100%; height: 200px; margin-top: 10px;">
      <canvas id="workChart"></canvas>
    </div>
  </section>

  <section class="history-card">
    <div class="history-head"><h2>今日の記録</h2><button id="resetBtn" class="tiny-button">リセット</button></div>
    <div id="history" class="history-empty">まだ作業記録がないよ</div>
  </section>
  <p class="hint">25分でチャイム。集中しているなら、止めずに超過分まで記録できます。</p>
</main>
<script src="script.js"></script>
</body>
</html>
